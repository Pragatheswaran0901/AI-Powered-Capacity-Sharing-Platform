version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: machhunt_postgres
    restart: always
    environment:
      POSTGRES_USER: machhunt
      POSTGRES_PASSWORD: machhunt_secure_password_2026
      POSTGRES_DB: machhunt
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U machhunt"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: machhunt_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://machhunt:machhunt_secure_password_2026@db:5432/machhunt
      - JWT_SECRET=machhunt_super_secret_jwt_access_key_coimbatore_msme_2026
      - JWT_REFRESH_SECRET=machhunt_super_secret_jwt_refresh_key_coimbatore_msme_2026
      - AI_PROVIDER=nlp_engine
      - PAYMENT_PROVIDER=escrow_simulated
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: machhunt_frontend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
